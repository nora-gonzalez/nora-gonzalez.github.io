<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
<form action="https://w3schools.com/action_page.php" method="post">
   <fieldset>
        <legend>Información Personal</legend>
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje"></textarea><br><br>
        <p>
        <label>Indica las mascotas</label>
        <input type="checkbox" name="gato">Gato
        <input type="checkbox" name="perro">Perro
        <input type="checkbox" name="pez">Pez
        </p>
        <p>
            <label>Sexo</label>
            <input type="radio" name="sexo" value="hombre">Hombre
            <input type="radio" name="sexo" value="mujer">Mujer
        </p>
        <label for="numero">Temperatura:</label>
        <input type="number" id="numero" name="numero" min="-50" max="50"><br><br>
    </fieldset> 
<button type="button">Botón</button>
<button type="submit">Enviar</button>
<button type="reset">Borrar</button>
</form>
</body>
</html>
