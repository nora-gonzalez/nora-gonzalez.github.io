<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de prueba de HTML5</title>
</head>
<body>
    <form action="https://lm.ciclo.iesnervion.es/registroweb.php" method="get">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" autofocus required><br/>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br/>

        <label for="url">Escribe la URL de tu página web personal:</label>
        <input type="url" id="url" name="url"><br/>

        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha"><br/>

        <label for="tiempo">Hora:</label>
        <input type="time" id="tiempo" name="tiempo"><br/>

        <label for="fechahora">Fecha y Hora:</label>
        <input type="datetime-local" id="fechahora" name="fechahora"><br/>

        <label for="mes">Mes:</label>
        <input type="month" id="mes" name="mes"><br/>

        <label for="semana">Semana:</label>
        <input type="week" id="semana" name="semana"><br/>

        <label for="numero">Número:</label>
        <input type="number" id="numero" name="numero" min="-10" max="10"><br/>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono"><br/>

        <label for="busqueda">Búsqueda:</label>
        <input type="search" id="busqueda" name="busqueda"><br/>

        <label for="color">Color favorito:</label>
        <input type="color" id="color" name="color"><br/>

        <input type="submit" value="Enviar">
    </form>
</body>
</html>
