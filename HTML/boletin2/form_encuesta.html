<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Preferencias de Desarrollo</title>
</head>
<body>
<form action="https://lm.ciclo.iesnervion.es/encuesta.php" method="post">
    <fieldset>
        <legend>Datos académicos</legend>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" required><br>
        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" required><br>
        <select>
            <option value="DAW">DAW</option>
            <option value="DAM" selected>DAM</option>
            <option value="ASIR">ASIR</option>
        </select>
    </fieldset>

    <fieldset>
        <legend>Preferencias técnicas</legend>
        <input type="radio" id="Java" name="lenguaje" value="Java">
        <label for="Java">Java</label>
        <input type="radio" id="Python" name="lenguaje" value="Python">
        <label for="Python">Python</label>
        <input type="radio" id="C#" name="lenguaje" value="C#">
        <label for="C#">C#</label>
        <input type="radio" id="JavaScript" name="lenguaje" value="JavaScript">
        <label for="JavaScript">JavaScript</label><br/>

        <input type="checkbox" id="Linux" name="Linux" value="aceptar">
        <label for="Linux">Linux</label>
        <input type="checkbox" id="Windows" name="Windows" value="aceptar">
        <label for="Windows">Windows</label>
        <input type="checkbox" id="MacOS" name="MacOS" value="aceptar">
        <label for="MacOS">MacOS</label><br/>
        <label for="comentarios">Comentarios:</label><br/>
        <textarea id="comentarios"></textarea><br/>

        <button type="reset">Restablecer</button>
        <button type="submit">Enviar</button>
    </fieldset>
</form>
</body>
</html>
