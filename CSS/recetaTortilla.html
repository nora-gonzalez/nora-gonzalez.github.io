<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECETA DE TORTILLA FRANCESA</title>
    <link rel="stylesheet" href="recetaTortilla.css" type="text/css" />
</head>
<body>
    <h1 class="fondo-azul">Receta de tortilla francesa</h1>
    <p class="subtitulo">Ingredientes:</p>
    <ul>
        <li class="sombra-roja"><i>Huevos</i></li>
        <li class="sombra-roja"><i>Aceite</i></li>
        <li class="sombra-roja"><i>Sal</i></li>
    </ul>
    <p class="subtitulo">Preparación:</p>
    <ol>
        <li class="sombra-azul">Calentar el aceite en una sartén</li>
        <li class="sombra-azul">Cascar el huevo y batirlo</li>
        <li class="sombra-azul">Verter el huevo batido en la sartén</li>
        <li class="sombra-azul">Esperar un par de minutos, voltear y volver a esperar.</li>
    </ol>
    <h2 class="fondo-rojo">Servir con mayonesa, tomate o jamón</h2>
</body>
</html>
