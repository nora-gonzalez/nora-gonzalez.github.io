<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción a Evento Tech</title>
</head>
<body>
    <form action="https://lm.ciclo.iesnervion.es/inscripcion.php" method="post" enctype="multipart/form-data">
        <label for="equipo">Nombre del Equipo:</label>
        <input type="text" id="equipo" name="equipo" autofocus required><br/>

        <label for="codigo_registro">Código de Registro:</label>
        <input type="text" id="codigo_registro" name="codigo_registro" value="HACK-2026-SEV" readonly><br/>
        
        <label for="fecha">Fecha de llegada:</label>
        <input type="date" id="fecha" name="fecha" min="2026-12-01" max="2026-12-15"><br/>

        <label for="hora">Hora de presentación:</label>
        <input type="time" id="hora" name="hora"><br/>

        <label for="color">Color identificativo del equipo:</label>
        <input type="color" id="color" name="color"><br/>

        <label for="nivel_java">Nivel estimado de Java (0 a 100):</label>
        <input type="range" id="nivel_java" name="nivel_java" min="0" max="100" step="5"><br/>

        <label for="expediente">Subir Expediente / CV:</label>
        <input type="file" id="expediente" name="expediente" accept=".pdf"><br/>
        <input type="submit" value="Inscribirse">
    </form>
</body>
</html>
